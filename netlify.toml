[build]
  publish = "."
  command = ""

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# the old GitHub Pages paths keep working if anything ever linked them
[[redirects]]
  from = "/cooper-crane-2/*"
  to = "/:splat"
  status = 301
  force = true
